project: qenlo-memory 0.4 — the best local, LLM-free agent memory
goal: "best in our niche (akshat, 2026-11-15): local, no LLM in the memory process, tiny, fast. bar = EdgeMem (arXiv:2609.05553); stretch = supermemory's published ~85% LongMemEval-S QA"
question: which LLM-free read-path changes raise end-to-end answer accuracy, not just recall, at CLI latency?
metrics:
  memscore: mean(locomo-obs R@5, locomo-turns R@5, lme-s recall_all@5)   # unchanged from 0.3
  qa: LongMemEval-S judged accuracy, 500 Qs (research/src/qa.py)
  edgemem_table: LME-S 470 Qs, all turns, session R/NDCG @3/@10 (research/src/lme_retrieval.py)
llm_in_eval_only:
  provider: NVIDIA NIM free tier (rate limited ~40 req/min/key)
  reader: nvidia/nemotron-3-ultra-550b-a55b, thinking off
  judge: minimaxai/minimax-m3.1-flash (amendment 3)
embedder: snowflake-arctic-embed:22m (ollama), qenlo 0.1.0b2
baseline_0.3: {memscore: 68.07}
experiments:
  E1-qa-harness: {status: running, note: "oracle run in progress; 0.3 and E3 QA next"}
  E2-embedders: {status: protocol locked, note: "models downloading"}
  E3-episode: {status: supported on memscore (70.16, +2.09), qa gate pending, note: "multi-hop and lme preference down"}
  E3.1-diversity: {status: refuted, note: "68.87; multi-hop loss is session-score demotion, not crowding"}
  E4-neighbours: {status: memscore down as predicted (68.02), judged in QA}
next: [E1 oracle, QA 0.3 vs E3 vs E4, edgemem table, judge check, E2 stage A]
